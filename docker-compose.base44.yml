services:
  web:
    image: node:16
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
    command:
      - sh
      - -ec
      - >-
        npm ci --no-audit --no-fund &&
        exec npx ng serve --host 0.0.0.0 --port 4200 --poll 1000
        --allowed-hosts ".$${BASE44_SANDBOX_HOST_DOMAIN}"
    ports:
      - "3000:4200"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:4200/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 240s

volumes:
  node_modules:
